name: Verify BodyMake test environment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python for in-memory image fixtures and mocked learning tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test-only Python dependencies
        run: python3 -m pip install --no-cache-dir -r scripts/food-ai/streaming/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify shared test launcher
        run: npm run test:team-runtime

      - name: Verify shared Firebase test isolation
        run: npm run test:shared-test

      - name: Verify consent, photo upload, metadata removal and receipts in memory
        run: npm run test:photo-submission

      - name: Verify model-cache logic with mocks
        run: npm run test:food-ai:model-cache

      - name: Verify learning safety using mocks only (no Drive or training run)
        run: npm run test:food-ai:stream

      - name: Verify workout plans
        run: npm run test:workout-split

      - name: Verify muscle activity window and region mapping
        run: npm run test:muscle-activity

      - name: Verify weekly workout advice from recorded facts
        run: npm run test:weekly-workout-advice

      - name: Build without production AWS settings
        env:
          NEXT_PUBLIC_BODYMAKE_AUTH_DOMAIN: https://production-should-not-be-used.invalid
          NEXT_PUBLIC_BODYMAKE_CLIENT_ID: production-placeholder
          NEXT_PUBLIC_BODYMAKE_API_URL: https://production-api-should-not-be-used.invalid
          NEXT_PUBLIC_BODYMAKE_CALLBACK_URL: https://production-should-not-be-used.invalid/auth/callback/
          NEXT_PUBLIC_BODYMAKE_LOGOUT_URL: https://production-should-not-be-used.invalid/
        run: npm run build:test

      - name: Verify test build isolation
        run: npm run test:environment-build

      - name: Verify mobile viewport behavior
        run: npm run test:mobile-viewport
