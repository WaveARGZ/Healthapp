name: Deploy shared test (never production)

on:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bodymake-shared-test
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'WaveARGZ/Healthapp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:team-runtime
      - run: npm run test:shared-test
      - run: npm run build:shared-test
      - run: npm run test:shared-test-build
      - uses: actions/upload-artifact@v4
        with:
          name: shared-test-static
          path: .next-test/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: shared-test
      url: https://bodymake-test-14a3f.web.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install tested deployment CLI before authenticating
        run: npm install --global firebase-tools@14.12.0
      - uses: actions/download-artifact@v4
        with:
          name: shared-test-static
          path: .next-test
      - name: Authenticate with short-lived test-project identity (no private key)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.BODYMAKE_TEST_WIF_PROVIDER }}
          service_account: ${{ vars.BODYMAKE_TEST_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy static site to test project only
        run: firebase deploy --only hosting --project bodymake-test-14a3f --config firebase.shared-test.json --non-interactive
