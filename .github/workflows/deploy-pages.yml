name: Deploy BodyMake to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          NEXT_PUBLIC_BODYMAKE_TRAINING_ENDPOINT: ${{ vars.BODYMAKE_TRAINING_ENDPOINT }}
          NEXT_PUBLIC_BODYMAKE_AUTH_DOMAIN: ${{ vars.BODYMAKE_AUTH_DOMAIN }}
          NEXT_PUBLIC_BODYMAKE_CLIENT_ID: ${{ vars.BODYMAKE_CLIENT_ID }}
          NEXT_PUBLIC_BODYMAKE_API_URL: ${{ vars.BODYMAKE_API_URL }}
          NEXT_PUBLIC_BODYMAKE_CALLBACK_URL: ${{ vars.BODYMAKE_CALLBACK_URL }}
          NEXT_PUBLIC_BODYMAKE_LOGOUT_URL: ${{ vars.BODYMAKE_LOGOUT_URL }}
          NEXT_PUBLIC_BODYMAKE_GOOGLE_SIGN_IN_ENABLED: ${{ vars.BODYMAKE_GOOGLE_SIGN_IN_ENABLED }}
        run: npm run build

      - name: Verify mobile keyboard detection
        run: npm run test:mobile-viewport

      - name: Verify exported pages and logo paths
        run: npm run test:static-ui

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
